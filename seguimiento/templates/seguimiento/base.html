{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}TesisManager — FCC BUAP{% endblock %}</title>

    <!-- Bootstrap 5 CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Hoja de Estilos de Identidad BUAP -->
    <link rel="stylesheet" href="{% static 'seguimiento/css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'seguimiento/css/styles.css' %}">

    {% block estilos_extra %}{% endblock %}

    <!-- Script de Inicialización Inmediata de Tema -->
    <script>
        (function() {
            let tema = localStorage.getItem('tesis_theme');
            if (!tema) {
                tema = '{{ user.perfil.configuracion.tema|default:"system" }}'.toLowerCase();
            }

            const html = document.documentElement;
            if (tema === 'dark') {
                html.setAttribute('data-bs-theme', 'dark');
            } else if (tema === 'light') {
                html.setAttribute('data-bs-theme', 'light');
            } else {
                const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.setAttribute('data-bs-theme', prefiereOscuro ? 'dark' : 'light');
            }
        })();
    </script>
</head>
<body class="d-flex flex-column min-vh-100">

    {% include 'seguimiento/includes/navbar.html' %}

    <main class="flex-grow-1">
        {% block contenido %}{% endblock %}
    </main>

    {% include 'seguimiento/includes/footer.html' %}

    <!-- Scripts de Bootstrap y Tema -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'seguimiento/js/theme.js' %}"></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
